name: Build and validate edge image

on:
  push:
    branches: [master]
    paths:
      - "deploy/edge/**"
      - "IRIs/**"
      - "constraints/**"
      - ".github/workflows/edge-build.yml"
  pull_request:
    paths:
      - "deploy/edge/**"
      - "IRIs/**"
      - "constraints/**"
      - ".github/workflows/edge-build.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-northeast-1
  ECR_REGISTRY: 353236395445.dkr.ecr.ap-northeast-1.amazonaws.com

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials for ECR push
        if: github.ref == 'refs/heads/master' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::353236395445:role/luciadb-github-actions

      - name: Log in to Amazon ECR
        if: github.ref == 'refs/heads/master' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Fuseki test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/fuseki/Dockerfile
          platforms: linux/arm64
          build-args: |
            JENA_VERSION=6.2.0
          tags: fuseki:${{ github.sha }}
          load: true
          push: false

      - name: Build edge image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/edge/Dockerfile
          platforms: linux/arm64
          tags: fuseki-edge:${{ github.sha }}
          load: true
          push: false

      - name: Start Fuseki and edge containers
        run: |
          test "$(docker image inspect fuseki:${{ github.sha }} --format '{{.Architecture}}')" = "arm64"
          test "$(docker image inspect fuseki-edge:${{ github.sha }} --format '{{.Architecture}}')" = "arm64"
          docker run -d --name fuseki-test \
            -p 3030:3030 -p 8080:8080 \
            fuseki:${{ github.sha }}
          docker run -d --name edge-test \
            --network container:fuseki-test \
            -e LAST_UPDATE=test \
            -e CF_CUSTOM_HOSTNAME_CHALLENGE_ID=test-token \
            -e CF_CUSTOM_HOSTNAME_CHALLENGE_VALUE=test-value \
            -e CF_CUSTOM_HOSTNAME_DCV_PATH=/.well-known/acme-challenge/test-dcv-token \
            -e CF_CUSTOM_HOSTNAME_DCV_VALUE=test-dcv-value \
            fuseki-edge:${{ github.sha }}

      - name: Wait for edge and Fuseki to become healthy
        run: |
          for i in $(seq 1 60); do
            fuseki_status="$(docker inspect --format='{{.State.Health.Status}}' fuseki-test 2>/dev/null || echo unknown)"
            edge_status="$(docker inspect --format='{{.State.Health.Status}}' edge-test 2>/dev/null || echo unknown)"
            echo "attempt $i: fuseki=$fuseki_status edge=$edge_status"
            if [ "$fuseki_status" = "healthy" ] && [ "$edge_status" = "healthy" ]; then
              exit 0
            fi
            if [ "$fuseki_status" = "unhealthy" ] || [ "$edge_status" = "unhealthy" ]; then
              echo "Container reported unhealthy" >&2
              exit 1
            fi
            sleep 5
          done
          echo "Timed out waiting for healthy status" >&2
          exit 1

      - name: Assert edge behavior
        run: |
          set -eu

          expect_status() {
            method="$1"; url="$2"; expected="$3"; shift 3
            actual="$(curl -s -o /tmp/resp_body -w '%{http_code}' -X "$method" "$@" "$url")"
            echo "$method $url -> $actual (expected $expected)"
            if [ "$actual" != "$expected" ]; then
              echo "FAIL: $method $url returned $actual, expected $expected" >&2
              cat /tmp/resp_body >&2 || true
              exit 1
            fi
          }

          expect_status GET "http://localhost:8080/sparql?query=ASK%20%7B%7D" 200
          expect_status GET "http://localhost:8080/sparql/data?default" 200
          expect_status POST "http://localhost:8080/sparql/update" 404 \
            --data-urlencode 'update=INSERT DATA { <http://example/s> <http://example/p> "x" }'
          expect_status POST "http://localhost:8080/sparql/data?default" 405 \
            -H 'Content-Type: text/turtle' \
            --data '<http://example/s> <http://example/p> "x" .'
          expect_status GET "http://localhost:8080/rdf/IRIs/lily_schema.ttl" 200
          expect_status GET "http://localhost:8080/rdf/constraints/Lily_Shape.ttl" 200
          expect_status GET "http://localhost:8080/sparql/last-update" 200
          grep -Fx '{"last_update": "test"}' /tmp/resp_body
          expect_status GET "http://localhost:8080/.well-known/cf-custom-hostname-challenge/test-token" 200
          grep -Fx "test-value" /tmp/resp_body
          expect_status GET "http://localhost:8080/.well-known/acme-challenge/test-dcv-token" 200
          grep -Fx "test-dcv-value" /tmp/resp_body

      - name: Dump container logs
        if: always()
        run: |
          docker logs fuseki-test || true
          docker logs edge-test || true

      - name: Push validated edge image to ECR
        if: github.ref == 'refs/heads/master' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
        run: |
          set -eu
          docker tag fuseki-edge:${{ github.sha }} "${ECR_REGISTRY}/luciadb/edge:${{ github.sha }}"
          docker push "${ECR_REGISTRY}/luciadb/edge:${{ github.sha }}"

      - name: Clean up containers
        if: always()
        run: docker rm -f edge-test fuseki-test || true
