name: rdflint
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  rdflint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: 17
    - uses: imas/setup-rdflint@v4
    - name: Run rdflint
      run: rdflint -config .rdflint/rdflint-config.yml
