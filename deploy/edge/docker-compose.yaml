version: "3.4"

services:
  fuseki:
    build:
      context: ../../
      dockerfile: deploy/fuseki/Dockerfile
      args:
        JENA_VERSION: "6.2.0"
    image: fuseki
    ports:
      - "8080:8080"

  edge:
    build:
      context: ../../
      dockerfile: deploy/edge/Dockerfile
    image: fuseki-edge
    environment:
      LAST_UPDATE: local
    depends_on:
      - fuseki
    network_mode: "service:fuseki"
