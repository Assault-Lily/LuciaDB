server {
    listen 8080;
    server_name _;

    location = /healthz {
        proxy_pass http://127.0.0.1:3030/sparql/query?query=ASK%20%7B%7D;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }

    location ^~ /.well-known/cf-custom-hostname-challenge/ {
        root /usr/share/nginx/html;
        default_type text/plain;
        try_files $uri =404;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        default_type text/plain;
        try_files $uri =404;
    }

    location = /sparql/last-update {
        alias /usr/share/nginx/html/last-update.json;
        default_type application/json;
    }

    location /sparql/data {
        proxy_pass http://127.0.0.1:3030/sparql/data;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        add_header Content-Type "text/turtle; charset=UTF-8" always;
    }

    location /sparql {
        proxy_pass http://127.0.0.1:3030/sparql;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
    }

    location /rdf/IRIs {
        alias /usr/share/nginx/html/rdf/IRIs;
        default_type "text/turtle; charset=UTF-8";
    }

    location /rdf/constraints {
        alias /usr/share/nginx/html/rdf/constraints;
        default_type "text/turtle; charset=UTF-8";
    }

    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
